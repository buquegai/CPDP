schema_version: 1

data:
  root: "../data"
  file_suffix: "__FedCPDP.csv"
  label_column: "defect_label"
  cleaning: "master"
  families:
    NASA:
      projects: [CM1, MW1, PC1, PC3, PC4]
      effort_column: "LOC_TOTAL"
    AEEEM:
      projects: [EQ, JDT, LC, ML, PDE]
      effort_column: "ck_oo_numberOfLinesOfCode"
    ReLink:
      projects: [Apache, Safe, Zxing]
      effort_column: "CountLineCode"
    PROMISE:
      projects:
        - ant-1.7
        - camel-1.6
        - ivy-2.0
        - jedit-4.0
        - log4j-1.0
        - lucene-2.4
        - poi-3.0
        - synapse-1.2
        - tomcat
        - velocity-1.6
        - xalan-2.4
        - xerces-1.3
      effort_column: "loc"

experiment:
  protocol: "within-family-multisource-transductive-lopo"
  target_labels: "evaluation-only"
  # 正式实验：IPGDO 对每个目标项目固定一个过采样种子，预测模型独立运行10个种子后取均值。
  repetitions: 10
  seeds:
    - 2026072201
    - 2026072202
    - 2026072203
    - 2026072204
    - 2026072205
    - 2026072206
    - 2026072207
    - 2026072208
    - 2026072209
    - 2026072210
  metrics: [auc, auprc, mcc, f1, gmean, popt20]
  output_dir: "outputs"
  save_predictions: true

profiles:
  full:
    dssdpp:
      source_selection: "corr"
      use_weka_cfs: true
    master:
      lambda: 0.5
      smote_k_neighbors: 5
    fedcpdp:
      backend: "torch"
      device: "auto"
      dtype: "float32"
      seed_strategy: "independent_blake2"
      result_signature: "fedcpdp-torch-manual-v3-outer10-independent-blake2"
      rounds: 80
      local_epochs: 12
      ensemble_size: 3
      hash_dim: 1024
      parallel_workers: 1
      batch_ensemble_on_device: true
      outer_seed_batch_size: 10  # Throughput only; each seed keeps its full training budget.
    fd_hdp_u:
      pretrain_epochs: 50
      fine_tune_epochs: 100
      compressed_dim: 128
      device: "auto"
    mbl_cpdp_sv:
      wall_clock_seconds: 60
      candidate_timeout_seconds: 20
      final_fit_timeout_seconds: 60
      upper_evaluations: 10000
      lower_evaluations: 5
      ensemble_pool_size: 6
      ensemble_selected_size: 3
      parallel_workers: 5
    ipgdo_kan_jepa:
      # 结果版本随正式参数方案变化；用于防止断点续跑误用旧参数结果。
      result_signature: "ipgdo-kan-jepa-pinn-ipgdo-r1p0-v3"
      oversampling: &full_proposed_oversampling
        # IPGDO：项目条件表格 DDPM 生成 + 自适应隐式公式物理约束。
        device: "auto"
        # 每个源项目最终期望达到的“缺陷样本数 / 正常样本数”。
        target_minority_ratio: 1.0
        role:
          # 每个语义角色最多保留的原始度量特征数。
          max_components: 4
          # 角色特征稀疏逻辑回归的正则强度。
          l1_c: 0.2
          # 低于该权重的角色成分被舍弃。
          minimum_component_weight: 0.01
        formula:
          # 符号公式筛选的L1逻辑回归正则强度。
          l1_c: 0.1
          # 最多保留的符号公式项数。
          max_terms: 10
          # 公式可靠性最低阈值；0表示不因阈值关闭公式。
          minimum_reliability: 0.0
          # 是否按留一项目验证可靠性缩放物理损失；当前关闭软加权。
          use_reliability_weighting: false
          # 局部项目公式向全局公式收缩的强度。
          project_blend_strength: 50.0
          # 项目局部公式拟合所需的最小类别样本数。
          minimum_class_samples: 4
        diffusion:
          hidden_dim: 256
          residual_blocks: 4
          dropout: 0.1
          timesteps: 200
          schedule: "cosine"
          epochs: 300
          batch_size: 256
          learning_rate: 0.001
          weight_decay: 0.00001
          gradient_clip_norm: 1.0
          sample_batch_size: 1024
          use_amp: true
          normalized_clip: 8.0
          # 物理损失在前若干比例训练轮次中线性升权，避免破坏扩散预训练。
          physics_warmup_fraction: 0.2
          # 公式一致性损失权重；当前按既定方案关闭。
          formula_consistency_weight: 0.0
          # 公式语义损失权重。
          formula_semantic_weight: 0.05
      # 新架构不得读取旧 IPGDO 的候选样本缓存。
      oversampling_reuse: &full_oversampling_reuse
        enabled: false
      predictor:
        device: "auto"
        input_clip: 8.0
        # 数据不分流：真实源样本与生成源样本同时用于 JEPA 和分类器训练。
        data_flow_mode: "shared_augmented_source"
        encoder:
          hidden_dims: [128, 64]
          latent_dim: 64
          grid_size: 5
          spline_order: 3
          grid_range: [-6.0, 6.0]
          base_scale: 1.0
          spline_scale: 0.1
          dropout: 0.1
        jepa_predictor:
          hidden_dims: [128]
          mask_embedding_dim: 32
          dropout: 0.1
        classifier:
          # TabR从全部带标签源样本中为每个查询检索的近邻数量。
          context_size: 32
          # TabR的E-R-P三个阶段共享的主表示维度。
          hidden_dim: 128
          hidden_multiplier: 2.0
          encoder_blocks: 1
          predictor_blocks: 1
          context_dropout: 0.1
          dropout: 0.1
          # 只影响候选编码显存和速度，不改变检索与分类逻辑。
          candidate_batch_size: 1024
        views: &full_jepa_views
          minimum_mask_ratio: 0.2
          maximum_mask_ratio: 0.5
          target_noise_std: 0.01
          consistency_noise_std: 0.02
        losses: &full_jepa_losses
          jepa: 1.0
          classification: 1.0
          alignment: 0.1
          consistency: 0.1
          variance: 0.05
          covariance: 0.01
        optimization: &full_jepa_optimization
          pretrain_epochs: 80
          joint_epochs: 150
          batch_size: 256
          learning_rate: 0.0005
          weight_decay: 0.00001
          ema_momentum: 0.996
          early_stopping_patience: 25
          gradient_clip_norm: 1.0
          source_weight_temperature: 1.0
          source_weight_update_interval: 5
          use_amp: true
          refit_all_sources: true
          log_every_epochs: 10
    ipgdo_transformer_jepa:
      # 与 KAN-JEPA 分开标记结果版本，避免两个预测架构互相复用结果。
      result_signature: "ipgdo-transformer-jepa-pinn-ipgdo-r1p0-v3"
      oversampling: *full_proposed_oversampling
      oversampling_reuse: *full_oversampling_reuse
      predictor:
        device: "auto"
        input_clip: 8.0
        encoder:
          model_dim: 64
          latent_dim: 64
          num_heads: 4
          num_layers: 2
          feedforward_dim: 128
          dropout: 0.1
          activation: "gelu"
        jepa_predictor:
          model_dim: 64
          num_heads: 4
          num_layers: 2
          feedforward_dim: 128
          dropout: 0.1
          activation: "gelu"
        views: *full_jepa_views
        losses: *full_jepa_losses
        optimization: *full_jepa_optimization
  smoke:
    dssdpp:
      source_selection: "corr"
      use_weka_cfs: true
    master:
      lambda: 0.5
      smote_k_neighbors: 3
    fedcpdp:
      backend: "torch"
      device: "auto"
      dtype: "float32"
      seed_strategy: "independent_blake2"
      result_signature: "fedcpdp-torch-manual-v3-outer1-independent-blake2"
      rounds: 1
      local_epochs: 1
      ensemble_size: 1
      hash_dim: 64
      parallel_workers: 1
      batch_ensemble_on_device: true
      outer_seed_batch_size: 1
    fd_hdp_u:
      pretrain_epochs: 1
      fine_tune_epochs: 1
      compressed_dim: 128
      device: "auto"
    mbl_cpdp_sv:
      wall_clock_seconds: 20
      candidate_timeout_seconds: 5
      final_fit_timeout_seconds: 15
      upper_evaluations: 4
      lower_evaluations: 2
      ensemble_pool_size: 2
      ensemble_selected_size: 1
      parallel_workers: 2
    ipgdo_kan_jepa:
      oversampling: &smoke_proposed_oversampling
        # 仅供快速冒烟测试使用，不要在这里调整正式实验参数。
        device: "auto"
        target_minority_ratio: 1.0
        role:
          max_components: 4
          l1_c: 0.2
          minimum_component_weight: 0.01
        formula:
          l1_c: 0.1
          max_terms: 10
          minimum_reliability: 0.0
          use_reliability_weighting: false
          project_blend_strength: 50.0
          minimum_class_samples: 4
        diffusion:
          hidden_dim: 64
          residual_blocks: 2
          dropout: 0.0
          timesteps: 12
          schedule: "cosine"
          epochs: 2
          batch_size: 256
          learning_rate: 0.001
          weight_decay: 0.00001
          gradient_clip_norm: 1.0
          sample_batch_size: 128
          use_amp: true
          normalized_clip: 8.0
          physics_warmup_fraction: 0.2
          formula_consistency_weight: 0.0
          formula_semantic_weight: 0.05
      oversampling_reuse: &smoke_oversampling_reuse
        enabled: false
      predictor:
        device: "auto"
        input_clip: 8.0
        # 冒烟测试沿用正式实验的数据不分流策略。
        data_flow_mode: "shared_augmented_source"
        encoder:
          hidden_dims: [32]
          latent_dim: 16
          grid_size: 3
          spline_order: 2
          grid_range: [-6.0, 6.0]
          base_scale: 1.0
          spline_scale: 0.1
          dropout: 0.0
        jepa_predictor:
          hidden_dims: [32]
          mask_embedding_dim: 8
          dropout: 0.0
        classifier:
          context_size: 8
          hidden_dim: 32
          hidden_multiplier: 2.0
          encoder_blocks: 1
          predictor_blocks: 1
          context_dropout: 0.0
          dropout: 0.0
          candidate_batch_size: 256
        views: &smoke_jepa_views
          minimum_mask_ratio: 0.2
          maximum_mask_ratio: 0.5
          target_noise_std: 0.01
          consistency_noise_std: 0.02
        losses: &smoke_jepa_losses
          jepa: 1.0
          classification: 1.0
          alignment: 0.1
          consistency: 0.1
          variance: 0.05
          covariance: 0.01
        optimization: &smoke_jepa_optimization
          pretrain_epochs: 1
          joint_epochs: 2
          batch_size: 256
          learning_rate: 0.001
          weight_decay: 0.00001
          ema_momentum: 0.99
          early_stopping_patience: 1
          gradient_clip_norm: 1.0
          source_weight_temperature: 1.0
          source_weight_update_interval: 1
          use_amp: true
          refit_all_sources: true
          log_every_epochs: 1
    ipgdo_transformer_jepa:
      oversampling: *smoke_proposed_oversampling
      oversampling_reuse: *smoke_oversampling_reuse
      predictor:
        device: "auto"
        input_clip: 8.0
        encoder:
          model_dim: 16
          latent_dim: 16
          num_heads: 4
          num_layers: 1
          feedforward_dim: 32
          dropout: 0.0
          activation: "gelu"
        jepa_predictor:
          model_dim: 16
          num_heads: 4
          num_layers: 1
          feedforward_dim: 32
          dropout: 0.0
          activation: "gelu"
        views: *smoke_jepa_views
        losses: *smoke_jepa_losses
        optimization: *smoke_jepa_optimization
