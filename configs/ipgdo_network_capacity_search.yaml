schema_version: 1

# ==================== 路径设置 ====================
paths:
  # 正式实验配置只读取，不会被参数搜索脚本覆盖。
  experiment_config: "experiment.yaml"
  # 本轮搜索、断点状态、排名、图片和冠军结果使用独立目录。
  output_dir: "outputs/ipgdo_network_capacity_search"
  validation_output_dir: "outputs/ipgdo_network_capacity_search/validation_runs"
  # 冠军确定后自动执行的10种子完整CPDP结果目录。
  final_cpdp_output_dir: "outputs/ipgdo_network_capacity_search/final_cpdp_runs"
  runner_script: "run_oversampling_validation.py"

# ==================== 方法设置 ====================
method:
  oversampling_method: "ipgdo_kan_jepa"
  oversampling_profile: "full"
  generated_profile_name: "search"
  final_cpdp_profile_name: "final_cpdp"
  variant_name: "full"
  variant_kind: "current"

# ==================== 当前网络容量基线 ====================
# 下面三个值来自当前正式扩散模型，也必须分别出现在候选列表中。
initial_values:
  diffusion_hidden_dim: 256
  diffusion_residual_blocks: 4
  diffusion_timesteps: 200

# ==================== 本轮参数候选范围 ====================
# 如需调整搜索范围，只修改这里；每个列表必须包含上面的对应起点。
parameter_grids:
  # 去噪网络内部特征宽度；增大后容量和显存、计算成本通常同步增加。
  diffusion_hidden_dim: [128, 192, 256, 384, 512]
  # 去噪网络残差块数量；增大后网络更深，但训练和推理耗时也会增加。
  diffusion_residual_blocks: [2, 3, 4, 5, 6]
  # 前向扩散离散步数；生成时反向去噪成本通常近似随该值线性增长。
  diffusion_timesteps: [100, 150, 200, 300, 400]

# ==================== 随机种子 ====================
# 候选先使用5个种子筛选，最终冠军补充到10个Source-CV种子。
seeds:
  screening:
    - 2026072201
    - 2026072202
    - 2026072203
    - 2026072204
    - 2026072205
  confirmation:
    - 2026072206
    - 2026072207
    - 2026072208
    - 2026072209
    - 2026072210

# ==================== 前五轮确定的最佳参数 ====================
# 本轮只改变diffusion.hidden_dim、residual_blocks和timesteps。
fixed_overrides:
  target_minority_ratio: 0.6
  candidate_multiplier: 3.5
  formula:
    l1_c: 0.1
    max_terms: 10
    minimum_reliability: 0.0
    use_reliability_weighting: false
  diffusion:
    epochs: 300
    learning_rate: 0.001
    physics_warmup_fraction: 0.2
    formula_consistency_weight: 0.0
    formula_semantic_weight: 0.05
    defect_anchor_start_fraction: 0.5
    guidance_scale: 1.5
    physics_timestep_fraction: 0.4
    condition_dropout: 0.1
  manifold:
    lower_quantile: 0.025
    upper_quantile: 0.975
    neighbors: 5

# ==================== 统一验证环境 ====================
validation:
  source_cv:
    folds: 3
    validation_fraction: 0.20
  classifier:
    kind: "logistic_regression"
    c: 1.0
    max_iter: 2000
    class_weight: null
  quality:
    max_samples: 1000
    knn_neighbors: 5
    near_duplicate_quantile: 0.05
    # 评价标准必须固定，不能随待搜索的模型参数变化。
    manifold_lower_quantile: 0.05
    manifold_upper_quantile: 0.95
    coverage_quantile: 0.95
    exact_tolerance: 0.0000000001

# ==================== 最优参数判定规则 ====================
selection:
  metrics: [auc, auprc, mcc, f1, gmean, popt20]
  top_values_per_stage: 2
  maximum_allowed_decline:
    auc: 0.005
    auprc: 0.005
    popt20: 0.01

# ==================== 冠军完整CPDP复验 ====================
final_cpdp:
  enabled: true
  # 自动使用上面的5个筛选种子和5个确认种子，共10个种子。
  use_all_search_seeds: true
  validation_fraction: 0.20

# ==================== 执行与弹性GPU调度 ====================
execution:
  workers: 4
  fail_fast: true
  elastic_gpu:
    enabled: true
    launch_utilization_limit: 75
    minimum_free_memory_mb: 2048
    maximum_temperature_c: 80
    poll_seconds: 2
    ramp_up_seconds: 8
    pause_process_names: []
